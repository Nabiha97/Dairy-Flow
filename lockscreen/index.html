<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dairy Flow - Recharge Required</title>
    <link rel="stylesheet" href="/lockscreen/styles.css">
</head>
<body>
    <div class="container">
        <div class="lock-screen">
<!-- Logo Placeholder -->
<div class="logo-placeholder">
    <div class="placeholder-circle">
        <img src="logo.png" alt="Dairy Flow Logo" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
    </div>
</div>
            <!-- Brand Name -->
            <h1 class="brand-name">Dairy Flow</h1>

            <!-- Lock Icon -->
            <div class="lock-icon-container">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 11H5C3.89543 11 3 11.8954 3 13V20C3 21.1046 3.89543 22 5 22H19C20.1046 22 21 21.1046 21 20V13C21 11.8954 20.1046 11 19 11Z" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M7 11V7C7 5.67392 7.52678 4.40215 8.46447 3.46447C9.40215 2.52678 10.6739 2 12 2C13.3261 2 14.5979 2.52678 15.5355 3.46447C16.4732 4.40215 17 5.67392 17 7V11" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12" cy="16" r="1.5" fill="#3B82F6"/>
                </svg>
            </div>

            <!-- Title -->
            <h2 class="lock-title">Account Locked</h2>

            <!-- Message -->
            <p class="lock-message">Your account access has been suspended due to insufficient balance.</p>
            <p class="lock-submessage">Please recharge immediately to continue using services.</p>
            <p class="expiry-date" style="color:#999; font-size:13px; margin-top:8px;"></p>

            <!-- Balance Card -->
            <div class="balance-card">
                <span class="balance-label">Current Balance</span>
                <span class="balance-amount">₹0.00</span>
            </div>

            <!-- Recharge Button -->
            <button class="recharge-btn" onclick="handleRecharge()">
                Recharge Now
            </button>

            <!-- Support Link -->
            <button class="support-link" onclick="handleSupport()">
                Need Help? Contact Support
            </button>

            <!-- Footer -->
            <div class="footer">
                <p>© 2026 Dairy Flow. All rights reserved.</p>
            </div>
        </div>
    </div>

    <link rel="stylesheet" href="/lockscreen/styles.css">
</body>
</html>
